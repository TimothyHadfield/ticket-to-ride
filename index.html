<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ticket to Ride — Timothy Hadfield</title>
<meta name="description" content="Ticket to Ride companion for the real table, computer opponents with measured strength, and a route lab — USA, Europe, Nordic Countries, India and Switzerland, plus online rooms.">
<meta name="theme-color" content="#0f1117">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/table.css?v=10">
<link rel="stylesheet" href="css/style.css?v=10">

<body>
<div id="app">
  <header class="top">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-logo"/></svg>
    <h1>Ticket to Ride</h1>
    <div class="sub" id="sub"></div>
    <nav class="toptabs" id="toptabs" aria-label="Sections"></nav>
    <div class="spacer"></div>
  </header>
  <main>
    <section class="view tbl-surface tbl-wood-dark" id="v-table" aria-label="Table"><div class="board-wrap"></div><div class="panel"></div></section>
    <section class="view tabletop tbl-surface tbl-wood-dark" id="v-play" aria-label="Play"><div class="rivals" aria-label="Other players"></div><div class="board-wrap"></div><div class="supply" aria-label="Cards to draw"></div><div class="panel"></div><div class="mine" aria-label="My cards and tickets"></div></section>
    <section class="view tbl-surface tbl-wood-dark" id="v-lab" aria-label="Route Lab"><div class="board-wrap"></div><div class="panel"></div></section>
    <section class="view" id="v-settings" aria-label="Settings"><div class="panel" style="border:0"></div></section>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
</div>

    <symbol id="i-play" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M5 16V8a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v8z M5 12h14 M8 19l-1.5 2 M16 19l1.5 2 M8.5 16v.01 M15.5 16v.01 M9 8h6"/></symbol>
